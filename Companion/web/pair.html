<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Pair Wonder Command</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #070a12; color: #e2e8f0; font: 16px system-ui, sans-serif; }
    main { width: min(92vw, 28rem); padding: 1.5rem; border: 1px solid #334155; border-radius: 1rem; background: #111827; }
    h1 { margin-top: 0; font-size: 1.4rem; }
    p { color: #94a3b8; line-height: 1.5; }
    input, button { box-sizing: border-box; width: 100%; margin-top: .75rem; padding: .8rem; border-radius: .6rem; font: inherit; }
    input { border: 1px solid #475569; background: #020617; color: white; }
    button { border: 0; background: #22d3ee; color: #020617; font-weight: 700; }
    #status { min-height: 1.5rem; color: #fbbf24; }
  </style>
</head>
<body>
  <main>
    <h1>Pair Wonder Command</h1>
    <p>Enter the one-time token shown in the Python companion terminal. The token stays in this browser tab and is not included in the page URL.</p>
    <form id="pair-form">
      <label for="pair-token">Pairing token</label>
      <input id="pair-token" type="password" autocomplete="off" required>
      <button type="submit">Connect</button>
    </form>
    <p id="status" role="status"></p>
  </main>
  <script>
    document.getElementById('pair-form').addEventListener('submit', async event => {
      event.preventDefault();
      const token = document.getElementById('pair-token').value.trim();
      const status = document.getElementById('status');
      status.textContent = 'Checking token…';
      try {
        const response = await fetch('/dashboard', {
          headers: { Authorization: `Bearer ${token}` },
          cache: 'no-store'
        });
        if (!response.ok) throw new Error('Token was rejected or the companion is unavailable.');
        const dashboard = await response.text();
        sessionStorage.setItem('wonder_command_companion_token', token);
        document.open();
        document.write(dashboard);
        document.close();
      } catch (error) {
        sessionStorage.removeItem('wonder_command_companion_token');
        status.textContent = error.message;
      }
    });
  </script>
</body>
</html>
